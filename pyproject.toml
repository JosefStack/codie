[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codie-cli"
version = "0.1.3"
description = "AI-powered CLI coding agent. Reads, writes, and debugs your code."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Joseph Johnson", email = "josefstack.dev@gmail.com" }
]

keywords = ["cli", "ai", "coding-agent", "llm", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "typer>=0.25.1",
  "rich>=13.0.0",
  "openai>=1.0.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "tavily-python>=0.7.24",
  "httpx>=0.27.0",
  "tomli-w>=1.0.0",
  "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
codie = "codie.cli:app"

[project.urls]
Homepage = "https://github.com/JosefStack/codie"
Repository = "https://github.com/JosefStack/codie"

[tool.hatch.build.targets.wheel]
packages = ["codie"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]